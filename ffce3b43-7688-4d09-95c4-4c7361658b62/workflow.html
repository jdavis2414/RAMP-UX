<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ramp - Workflow Runner</title>
  
  <!-- Product Brand Typography & Baseline -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* 
      ONLY the registered brand palette is used:
      Background: #ffffff
      Foreground: #111111
      Accent: #1677ff
      Surface: #f7f8fa
      Muted: #6b7280
      Border: #d9dee7
    */
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --accent: #1677ff;
      --surface: #f7f8fa;
      --muted: #6b7280;
      --border: #d9dee7;
      
      --radius: 8px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Classification Bar */
    .classification-bar {
      background-color: var(--fg);
      color: var(--bg);
      text-align: center;
      padding: 8px 16px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .classification-bar.bottom {
      border-bottom: none;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }
    .classification-tag {
      background-color: var(--accent);
      color: var(--bg);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 9px;
      letter-spacing: 0.05em;
    }

    /* Appbar */
    .appbar {
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      height: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 900;
    }
    .appbar-leading {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .appbar-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--fg);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .appbar-title svg {
      color: var(--accent);
    }
    .appbar-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .badge-role {
      background-color: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: var(--radius);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .profile-btn {
      background-color: var(--surface);
      border: 1px solid var(--border);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--fg);
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .profile-btn:hover {
      border-color: var(--accent);
      background-color: var(--bg);
    }

    /* Split Workspace Grid */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 114px); /* Subtract Appbar + Classification bars */
      overflow: hidden;
    }

    /* Vertical Navigation Sidebar (Left) */
    .sidebar-nav {
      width: 280px;
      background-color: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px 16px;
      gap: 20px;
    }
    .sidebar-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar-meta {
      font-family: monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .sidebar-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 4px;
      list-style: none;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s ease;
      gap: 12px;
    }
    .sidebar-item-label {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .sidebar-item:hover {
      background-color: rgba(17, 17, 17, 0.03);
    }
    .sidebar-item.active {
      background-color: var(--bg);
      border: 1px solid var(--border);
    }
    .sidebar-item.active .sidebar-item-label {
      color: var(--fg);
      font-weight: 600;
    }

    .sidebar-status-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .indicator-status {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
    }
    .indicator-status svg {
      width: 14px;
      height: 14px;
    }

    /* Task Workflow Area (Main Content Scroll) */
    .task-workflow-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
      overflow-y: auto;
      padding: 32px;
      position: relative;
    }

    .workflow-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    /* Breadcrumbs */
    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }
    .breadcrumb-item {
      color: var(--muted);
      text-decoration: none;
    }
    .breadcrumb-item:hover {
      color: var(--fg);
    }
    .breadcrumb-separator {
      color: var(--border);
    }

    .workflow-h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    /* Task Progress Bars Indicator (Horizontal timeline) */
    .progress-timeline {
      display: flex;
      align-items: center;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      gap: 8px;
      margin-bottom: 32px;
    }
    .timeline-step {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }
    .timeline-bar-bg {
      height: 6px;
      background-color: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .timeline-bar-fill {
      height: 100%;
      background-color: var(--border);
      transition: background-color 0.15s ease, width 0.15s ease;
    }
    .timeline-step.completed .timeline-bar-fill {
      background-color: var(--fg);
      width: 100%;
    }
    .timeline-step.in-progress .timeline-bar-fill {
      background-color: var(--accent);
      width: 50%;
    }
    .timeline-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .timeline-step.active .timeline-label {
      color: var(--fg);
      font-weight: 600;
    }

    /* Main Workflow Layout Splits */
    .workflow-content-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: start;
    }
    @media (min-width: 1200px) {
      .workflow-content-layout {
        grid-template-columns: 1fr 320px;
      }
    }

    /* Task List Panel */
    .task-list-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .task-list-title-label {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .task-list-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .task-list-item {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
    }
    .task-list-item:hover {
      border-color: var(--muted);
    }
    .task-info-side {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .task-name-label {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .task-desc-label {
      font-size: 12px;
      color: var(--muted);
    }

    .task-action-side {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .task-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .task-status-badge.completed {
      color: var(--fg);
    }
    .task-status-badge.completed svg {
      color: var(--fg);
    }
    .task-status-badge.in-progress {
      color: var(--accent);
    }
    .task-status-badge.in-progress svg {
      color: var(--accent);
    }

    .btn-action {
      background-color: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-action:hover {
      background-color: var(--surface);
      border-color: var(--fg);
    }
    .btn-action.primary-btn {
      background-color: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }
    .btn-action.primary-btn:hover {
      opacity: 0.9;
    }

    /* Side Cost Data Panel */
    .cost-data-panel {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .cost-panel-header {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--fg);
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .cost-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .cost-data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .cost-data-label {
      color: var(--muted);
    }
    .cost-data-value {
      font-weight: 500;
      font-family: monospace;
    }
    .total-cost-box {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .total-cost-val {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
      font-family: monospace;
    }

    /* Dynamic Placeholder Page Form */
    .placeholder-form-panel {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-input-select {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-family: var(--font);
      font-size: 14px;
      color: var(--fg);
      outline: none;
    }
    .form-input-select:focus {
      border-color: var(--accent);
    }

    .form-actions-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  
  <!-- ROOT REACT MOUNT -->
  <div id="root"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG icon pack
    const Icons = {
      Estimate: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      ),
      Profile: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      ),
      ChevronRight: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      ),
      ArrowLeft: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      ),
      Check: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      ),
      Dot: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle></svg>
      ),
      NotStarted: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle></svg>
      )
    };

    function App() {
      // Parse Query Parameters
      const [params, setParams] = useState({
        workflow: 'request-new',
        id: 'ENV-DEFAULT',
        role: 'owner'
      });

      useEffect(() => {
        const query = new URLSearchParams(window.location.search);
        setParams({
          workflow: query.get('workflow') || 'request-new',
          id: query.get('id') || ('ENV-' + Math.floor(1000 + Math.random() * 9000)),
          role: query.get('role') || 'owner'
        });
      }, []);

      // Translate workflow parameters to real human readable strings
      const workflowConfigs = {
        'request-estimate': {
          title: 'Request Cost Estimate',
          label: 'ABCD',
          tasks: [
            { key: 'ref-details', name: 'Reference Details', desc: 'Specify baseline environment references' },
            { key: 'compute-req', name: 'Compute Requirements', desc: 'Define required CPU nodes, RAM capacity, and storage blocks' },
            { key: 'pricing-param', name: 'Pricing Parameters', desc: 'Select billing tiers, SLA requirements, and instance terms' }
          ]
        },
        'request-new': {
          title: 'Request New Environment',
          label: 'Let\'s get your environment set up',
          tasks: [
            { key: 'prog-details', name: 'Program Details', desc: 'Define project scope, cost-center ID, and target users' },
            { key: 'cost-estimate', name: 'Cost Estimation', desc: 'Map required specifications to generate active budget projections' },
            { key: 'deploy-config', name: 'Deployment Config', desc: 'Select instance OS, cloud region, and routing network specs' },
            { key: 'access-control', name: 'Access Control', desc: 'Configure security groups, user roles, and reviewer RBAC' }
          ]
        },
        'edit': {
          title: 'Edit Environment',
          label: 'Modify environment allocations',
          tasks: [
            { key: 'mod-request', name: 'Modification Request', desc: 'State modification objectives and authorization codes' },
            { key: 'comp-adj', name: 'Compute Adjustments', desc: 'Scale CPUs, RAM pools, and hot-swappable node volumes' },
            { key: 'res-verify', name: 'Resource Verification', desc: 'Perform system checks and cost budget validations' }
          ]
        },
        'archive': {
          title: 'Archive Environment',
          label: 'Execute safe deprovisioning sequence',
          tasks: [
            { key: 'deprov-plan', name: 'Deprovisioning Plan', desc: 'Schedule teardown milestones and verify dependent workflows' },
            { key: 'data-retention', name: 'Data Retention', desc: 'Select storage archives, file retention, and clean-up schedules' },
            { key: 'sign-off', name: 'Sign-off Verification', desc: 'Obtain final operator approvals and archive cost-center logging' }
          ]
        },
        'monitor': {
          title: 'Monitor Environment',
          label: 'Review environment status and allocation metrics',
          tasks: [
            { key: 'env-metrics', name: 'Environment Metrics', desc: 'Review instance CPU spikes, memory telemetry, and egress data' },
            { key: 'res-alloc', name: 'Resource Allocation', desc: 'Analyze instance usage versus estimated resource pool budget' },
            { key: 'access-logs', name: 'Access Logs', desc: 'Verify user credentials, active sessions, and security logs' }
          ]
        }
      };

      const currentWorkflow = workflowConfigs[params.workflow] || workflowConfigs['request-new'];

      // Active state variables
      const [taskStates, setTaskStates] = useState({});
      const [costData, setCostData] = useState({
        cpu: '16 cores',
        ram: '64GB',
        gpu: 'None',
        nodes: '1',
        monthlyCost: '$180'
      });

      // Track active view: 'task-list' or the active placeholder task page key
      const [activeTaskView, setActiveTaskView] = useState('task-list');

      // Load initialized state on load
      useEffect(() => {
        const savedTasks = localStorage.getItem(`ramp_tasks_${params.id}`);
        if (savedTasks) {
          setTaskStates(JSON.parse(savedTasks));
        } else {
          // Initialize with default states (Reference/Details starts "Not Started" or similar)
          const init = {};
          currentWorkflow.tasks.forEach((t, i) => {
            init[t.key] = i === 0 ? 'In Progress' : 'Not Started';
          });
          setTaskStates(init);
        }

        const savedCost = localStorage.getItem(`ramp_cost_${params.id}`);
        if (savedCost) {
          setCostData(JSON.parse(savedCost));
        }
      }, [params.id, params.workflow]);

      // Save states
      const saveState = (updatedTasks, updatedCost) => {
        setTaskStates(updatedTasks);
        localStorage.setItem(`ramp_tasks_${params.id}`, JSON.stringify(updatedTasks));
        if (updatedCost) {
          setCostData(updatedCost);
          localStorage.setItem(`ramp_cost_${params.id}`, JSON.stringify(updatedCost));
        }
      };

      // Simulated Flet router routing on action button press
      const routeToTaskPage = (taskKey) => {
        setActiveTaskView(taskKey);
      };

      const handleSaveAndBack = (taskKey) => {
        // Complete the current task
        const updated = { ...taskStates, [taskKey]: 'Completed' };
        
        // Advance the next task to In Progress automatically
        const currentIndex = currentWorkflow.tasks.findIndex(t => t.key === taskKey);
        if (currentIndex !== -1 && currentIndex + 1 < currentWorkflow.tasks.length) {
          const nextTask = currentWorkflow.tasks[currentIndex + 1];
          if (updated[nextTask.key] !== 'Completed') {
            updated[nextTask.key] = 'In Progress';
          }
        }

        saveState(updated, costData);
        setActiveTaskView('task-list');
      };

      const handleCostParamChange = (field, val) => {
        // Calculate dynamic cost estimates based on selections
        let priceMultiplier = 1;
        let cores = parseInt(costData.cpu) || 16;
        let gb = parseInt(costData.ram) || 64;
        let instances = parseInt(costData.nodes) || 1;

        if (field === 'cpu') cores = parseInt(val) || 16;
        if (field === 'ram') gb = parseInt(val) || 64;
        if (field === 'nodes') instances = parseInt(val) || 1;

        let costEst = (cores * 5 + gb * 0.5 + (costData.gpu !== 'None' ? 300 : 0)) * instances;
        
        const updatedCost = {
          ...costData,
          [field]: val,
          monthlyCost: `$${Math.round(costEst)}`
        };
        setCostData(updatedCost);
      };

      const getStatusIcon = (status) => {
        if (status === 'Completed') return <Icons.Check style={{ color: 'var(--fg)' }} />;
        if (status === 'In Progress') return <Icons.Dot style={{ color: 'var(--accent)' }} />;
        return <Icons.NotStarted style={{ color: 'var(--border)' }} />;
      };

      // Render the current task details inside the organism content slot
      const renderTaskPageContent = (taskKey) => {
        const activeTask = currentWorkflow.tasks.find(t => t.key === taskKey);
        return (
          <div className="placeholder-form-panel" data-od-id={`task-page-panel-${taskKey}`}>
            <div className="workflow-header" style={{ marginBottom: '16px', borderBottom: '1px solid var(--border)', paddingBottom: '16px' }}>
              <div className="breadcrumbs">
                <a href="index.html" className="breadcrumb-item">Ramp</a>
                <span className="breadcrumb-separator"><Icons.ChevronRight /></span>
                <span className="breadcrumb-item">{currentWorkflow.title}</span>
                <span className="breadcrumb-separator"><Icons.ChevronRight /></span>
                <span style={{ color: 'var(--fg)', fontWeight: '600' }}>{activeTask.name}</span>
              </div>
              <h2 className="workflow-h1">{activeTask.name}</h2>
              <p style={{ color: 'var(--muted)', fontSize: '13px' }}>{activeTask.desc}</p>
            </div>

            {/* Dynamic Interactive Input Field Simulator */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
              
              <div className="form-group">
                <label>Compute Core Allocation</label>
                <select 
                  className="form-input-select"
                  value={costData.cpu}
                  onChange={(e) => handleCostParamChange('cpu', e.target.value)}
                  disabled={params.role === 'reviewer'}
                >
                  <option value="8 cores">8 CPU Cores (Standard)</option>
                  <option value="16 cores">16 CPU Cores (Performance)</option>
                  <option value="32 cores">32 CPU Cores (Compute High)</option>
                  <option value="64 cores">64 CPU Cores (Max Capacity)</option>
                </select>
              </div>

              <div className="form-group">
                <label>Target Memory Pool</label>
                <select 
                  className="form-input-select"
                  value={costData.ram}
                  onChange={(e) => handleCostParamChange('ram', e.target.value)}
                  disabled={params.role === 'reviewer'}
                >
                  <option value="32GB">32 GB RAM</option>
                  <option value="64GB">64 GB RAM</option>
                  <option value="128GB">128 GB RAM</option>
                  <option value="256GB">256 GB RAM</option>
                </select>
              </div>

              <div className="form-group">
                <label>Node Instance Count</label>
                <select 
                  className="form-input-select"
                  value={costData.nodes}
                  onChange={(e) => handleCostParamChange('nodes', e.target.value)}
                  disabled={params.role === 'reviewer'}
                >
                  <option value="1">1 Active Instance</option>
                  <option value="2">2 Multi-zone Instances</option>
                  <option value="4">4 High Availability Cluster Nodes</option>
                  <option value="8">8 Enterprise Load Balanced Nodes</option>
                </select>
              </div>

              <div className="form-group">
                <label>Authorization Status / Requestor Notes</label>
                <textarea 
                  className="form-input-select" 
                  style={{ height: '100px', resize: 'none' }}
                  placeholder="Insert authorization codes, reviewer notes or cost center justifications here..."
                  disabled={params.role === 'reviewer'}
                />
              </div>

            </div>

            <div className="form-actions-row">
              <button 
                className="btn-action" 
                onClick={() => setActiveTaskView('task-list')}
              >
                Cancel
              </button>
              <button 
                className="btn-action primary-btn"
                onClick={() => handleSaveAndBack(taskKey)}
                disabled={params.role === 'reviewer'}
              >
                Save & Continue
              </button>
            </div>
          </div>
        );
      };

      return (
        <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
          
          {/* Classification Bar Top */}
          <div className="classification-bar" data-od-id="classification-top">
            <span>CIDO RAMP PORTAL // CONTROLLED SPECIFICATION</span>
            <span className="classification-tag">INTERNAL USE ONLY</span>
            <span>ROLE PROFILE: {params.role.toUpperCase()}</span>
          </div>

          {/* Appbar */}
          <header className="appbar" data-od-id="appbar">
            <div className="appbar-leading">
              <a href="index.html" className="appbar-title" data-od-id="appbar-logo">
                <Icons.Estimate />
                <span>Ramp</span>
              </a>
            </div>
            <div className="appbar-actions">
              <span className="badge-role">{params.role} mode</span>
              <a href="index.html" className="profile-btn" title="Back to Dashboard" data-od-id="dashboard-back-btn">
                <Icons.ArrowLeft />
              </a>
            </div>
          </header>

          {/* Core Workspace split layout */}
          <div className="workspace">
            
            {/* Sidebar Navigation (Left side of page) */}
            <aside className="sidebar-nav" data-od-id="sidebar-nav">
              <div className="sidebar-header">
                <span className="sidebar-meta">{params.id}</span>
                <span className="sidebar-title">{currentWorkflow.title}</span>
              </div>
              
              <ul className="sidebar-menu">
                {currentWorkflow.tasks.map((task) => (
                  <li 
                    key={task.key}
                    className={`sidebar-item ${activeTaskView === task.key ? 'active' : ''}`}
                    onClick={() => {
                      if (taskStates[task.key] !== 'Not Started' || params.role === 'reviewer') {
                        routeToTaskPage(task.key);
                      }
                    }}
                    title={taskStates[task.key] === 'Not Started' ? 'Complete previous steps first' : ''}
                    data-od-id={`sidebar-item-${task.key}`}
                  >
                    <span className="sidebar-item-label">{task.name}</span>
                    <div className="sidebar-status-group">
                      <div className="indicator-status">
                        {getStatusIcon(taskStates[task.key])}
                      </div>
                    </div>
                  </li>
                ))}
              </ul>
            </aside>

            {/* Task Workflow Component (Takes up maximum width/height with scroll) */}
            <main className="task-workflow-container" data-od-id="task-workflow-container">
              
              {activeTaskView === 'task-list' ? (
                <>
                  {/* Header and Breadcrumbs */}
                  <div className="workflow-header" data-od-id="workflow-breadcrumb-header">
                    <div className="breadcrumbs">
                      <a href="index.html" className="breadcrumb-item">Ramp</a>
                      <span className="breadcrumb-separator"><Icons.ChevronRight /></span>
                      <span style={{ color: 'var(--fg)', fontWeight: '600' }}>{currentWorkflow.title}</span>
                    </div>
                    <h1 className="workflow-h1">{currentWorkflow.title}</h1>
                  </div>

                  {/* Horizontal Progress Timeline */}
                  <div className="progress-timeline" data-od-id="progress-timeline-organism">
                    {currentWorkflow.tasks.map((t) => (
                      <div 
                        key={t.key} 
                        className={`timeline-step ${taskStates[t.key] === 'Completed' ? 'completed' : taskStates[t.key] === 'In Progress' ? 'in-progress' : ''}`}
                      >
                        <div className="timeline-bar-bg">
                          <div className="timeline-bar-fill"></div>
                        </div>
                        <span className="timeline-label">{t.name}</span>
                      </div>
                    ))}
                  </div>

                  {/* Layout split with Cost Data details card */}
                  <div className="workflow-content-layout">
                    
                    {/* Primary Task List */}
                    <div className="task-list-panel" data-od-id="task-list-panel">
                      <h3 className="task-list-title-label">
                        {currentWorkflow.label}
                      </h3>
                      
                      <div className="task-list-stack">
                        {currentWorkflow.tasks.map((task) => (
                          <div className="task-list-item" key={task.key} data-od-id={`task-row-${task.key}`}>
                            <div className="task-info-side">
                              <span className="task-name-label">{task.name}</span>
                              <span className="task-desc-label">{task.desc}</span>
                            </div>
                            
                            <div className="task-action-side">
                              <span className={`task-status-badge ${taskStates[task.key]?.toLowerCase().replace(' ', '-')}`}>
                                {taskStates[task.key] || 'Not Started'}
                              </span>
                              
                              <button 
                                className={`btn-action ${taskStates[task.key] === 'In Progress' ? 'primary-btn' : ''}`}
                                onClick={() => routeToTaskPage(task.key)}
                                data-od-id={`task-btn-${task.key}`}
                              >
                                {taskStates[task.key] === 'Completed' ? 'Edit' : taskStates[task.key] === 'In Progress' ? 'Resume' : 'Start'}
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Cost Data Sidebar (maintained dynamically across saves) */}
                    <aside className="cost-data-panel" data-od-id="cost-data-sidebar">
                      <h4 className="cost-panel-header">Active Cost Data</h4>
                      <div className="cost-grid">
                        <div className="cost-data-row">
                          <span className="cost-data-label">Target Core Total</span>
                          <span className="cost-data-value">{costData.cpu}</span>
                        </div>
                        <div className="cost-data-row">
                          <span className="cost-data-label">Memory Allocation</span>
                          <span className="cost-data-value">{costData.ram}</span>
                        </div>
                        <div className="cost-data-row">
                          <span className="cost-data-label">GPU Provisioning</span>
                          <span className="cost-data-value">{costData.gpu}</span>
                        </div>
                        <div className="cost-data-row">
                          <span className="cost-data-label">Running Instances</span>
                          <span className="cost-data-value">{costData.nodes} unit{parseInt(costData.nodes) > 1 ? 's' : ''}</span>
                        </div>
                        
                        <div className="total-cost-box">
                          <span className="cost-data-label" style={{ fontWeight: '500', color: 'var(--fg)' }}>Estimated Rate</span>
                          <span className="total-cost-val">{costData.monthlyCost}<span style={{ fontSize: '11px', color: 'var(--muted)', fontWeight: '400' }}>/mo</span></span>
                        </div>
                      </div>
                    </aside>

                  </div>
                </>
              ) : (
                renderTaskPageContent(activeTaskView)
              )}

            </main>

          </div>

          {/* Classification Bar Bottom */}
          <footer className="classification-bar bottom" data-od-id="classification-bottom">
            <span>CIDO RAMP PORTAL // CONTROLLED SPECIFICATION</span>
            <span className="classification-tag">INTERNAL USE ONLY</span>
            <span>SYSTEM-WIDE LOGGING CONFIGURED</span>
          </footer>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
